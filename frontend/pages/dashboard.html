<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — DeepShield</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
  <div id="toast-container"></div>
  <div class="layout">
    <aside class="sidebar"></aside>
    <div class="main-content">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:1rem;">
          <button id="sidebar-toggle" class="btn btn-ghost" style="padding:0.5rem;" aria-label="Toggle sidebar">☰</button>
          <h1 style="font-size:1.125rem; font-weight:600; color:#f1f5f9;">Dashboard</h1>
        </div>
        <div style="display:flex; align-items:center; gap:1rem;">
          <span id="topbar-user" style="font-size:0.8rem; color:#64748b;"></span>
          <a href="/pages/detect.html" class="btn btn-primary" style="padding:0.5rem 1rem; font-size:0.8rem;">+ New Scan</a>
        </div>
      </header>

      <main class="page-content">
        <!-- Stat cards -->
        <div id="stats-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; margin-bottom:1.5rem;" class="stat-grid">
          <!-- Skeletons while loading -->
          <div class="stat-card"><div class="skeleton" style="height:16px; width:80px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:32px; width:60px;"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:16px; width:80px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:32px; width:60px;"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:16px; width:80px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:32px; width:60px;"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:16px; width:80px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:32px; width:60px;"></div></div>
          <div class="stat-card"><div class="skeleton" style="height:16px; width:80px; margin-bottom:0.5rem;"></div><div class="skeleton" style="height:32px; width:60px;"></div></div>
        </div>

        <!-- Charts -->
        <div style="display:grid; grid-template-columns:1fr 2fr; gap:1rem; margin-bottom:1.5rem;" id="charts-grid">
          <div class="card">
            <h2 style="font-size:0.875rem; font-weight:600; color:#94a3b8; margin-bottom:1rem;">Distribution</h2>
            <canvas id="pie-chart" height="220"></canvas>
            <div id="pie-empty" style="display:none; text-align:center; padding:2rem; color:#475569; font-size:0.875rem;">No data yet</div>
          </div>
          <div class="card">
            <h2 style="font-size:0.875rem; font-weight:600; color:#94a3b8; margin-bottom:1rem;">Scans Over Time (30 days)</h2>
            <canvas id="line-chart" height="220"></canvas>
            <div id="line-empty" style="display:none; text-align:center; padding:2rem; color:#475569; font-size:0.875rem;">No scans in the last 30 days</div>
          </div>
        </div>

        <!-- Recent scans -->
        <div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
            <h2 style="font-size:0.875rem; font-weight:600; color:#94a3b8;">Recent Scans</h2>
            <a href="/pages/history.html" style="font-size:0.8rem; color:#0ea5e9; text-decoration:none;">View all →</a>
          </div>
          <div id="recent-scans">
            <div style="display:flex; flex-direction:column; gap:0.75rem;">
              <div class="skeleton" style="height:48px;"></div>
              <div class="skeleton" style="height:48px;"></div>
              <div class="skeleton" style="height:48px;"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    initLayout('dashboard');

    let pieChart = null, lineChart = null;

    async function loadDashboard() {
      try {
        const stats = await DS.apiFetch('/api/stats');
        renderStats(stats);
        renderPie(stats);
        renderLine(stats);

        const history = await DS.apiFetch('/api/history?per_page=5');
        renderRecent(history.items);
      } catch (err) {
        showToast('Failed to load dashboard: ' + err.message, 'error');
      }
    }

    function renderStats(s) {
      const grid = document.getElementById('stats-grid');
      const avgPct = Math.round(s.avg_confidence * 100);
      grid.innerHTML = `
        <div class="stat-card">
          <div class="stat-label">Total Scans</div>
          <div class="stat-value">${s.total_scans}</div>
          <div class="stat-sub">all time</div>
        </div>
        <div class="stat-card" style="border-color:rgba(34,197,94,0.2)">
          <div class="stat-label">Real</div>
          <div class="stat-value" style="color:#22c55e">${s.real_count}</div>
          <div class="stat-sub">${s.total_scans ? Math.round(s.real_count/s.total_scans*100) : 0}% of total</div>
        </div>
        <div class="stat-card" style="border-color:rgba(239,68,68,0.2)">
          <div class="stat-label">Fake</div>
          <div class="stat-value" style="color:#ef4444">${s.fake_count}</div>
          <div class="stat-sub">${s.total_scans ? Math.round(s.fake_count/s.total_scans*100) : 0}% of total</div>
        </div>
        <div class="stat-card" style="border-color:rgba(245,158,11,0.2)">
          <div class="stat-label">Uncertain</div>
          <div class="stat-value" style="color:#f59e0b">${s.uncertain_count}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Confidence</div>
          <div class="stat-value" style="font-size:1.5rem">${avgPct}%</div>
        </div>
      `;
    }

    function renderPie(s) {
      const hasData = s.real_count + s.fake_count + s.uncertain_count + s.no_face_count > 0;
      document.getElementById('pie-empty').style.display = hasData ? 'none' : 'block';
      document.getElementById('pie-chart').style.display = hasData ? 'block' : 'none';
      if (!hasData) return;

      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById('pie-chart'), {
        type: 'doughnut',
        data: {
          labels: ['Real', 'Fake', 'Uncertain', 'No Face'],
          datasets: [{
            data: [s.real_count, s.fake_count, s.uncertain_count, s.no_face_count],
            backgroundColor: ['#22c55e', '#ef4444', '#f59e0b', '#64748b'],
            borderColor: '#1e293b',
            borderWidth: 2,
          }]
        },
        options: {
          plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } } },
          cutout: '65%',
        }
      });
    }

    function renderLine(s) {
      const hasData = s.scans_over_time.length > 0;
      document.getElementById('line-empty').style.display = hasData ? 'none' : 'block';
      document.getElementById('line-chart').style.display = hasData ? 'block' : 'none';
      if (!hasData) return;

      if (lineChart) lineChart.destroy();
      lineChart = new Chart(document.getElementById('line-chart'), {
        type: 'line',
        data: {
          labels: s.scans_over_time.map(d => d.date),
          datasets: [{
            label: 'Scans',
            data: s.scans_over_time.map(d => d.count),
            borderColor: '#0ea5e9',
            backgroundColor: 'rgba(14,165,233,0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3,
          }]
        },
        options: {
          scales: {
            x: { ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#64748b', stepSize: 1 }, grid: { color: '#1e293b' }, beginAtZero: true }
          },
          plugins: { legend: { display: false } },
        }
      });
    }

    function labelBadge(label) {
      const map = { REAL: 'badge-real', FAKE: 'badge-fake', UNCERTAIN: 'badge-uncertain', NO_FACE: 'badge-noface' };
      return `<span class="badge ${map[label] || 'badge-noface'}">${label}</span>`;
    }

    function renderRecent(items) {
      const el = document.getElementById('recent-scans');
      if (!items.length) {
        el.innerHTML = `<div style="text-align:center; padding:2rem; color:#475569;">
          <div style="font-size:2rem; margin-bottom:0.5rem;">🔍</div>
          No scans yet. <a href="/pages/detect.html" style="color:#0ea5e9; text-decoration:none;">Upload your first file →</a>
        </div>`;
        return;
      }
      el.innerHTML = `<table class="data-table">
        <thead><tr><th>File</th><th>Type</th><th>Result</th><th>Confidence</th><th>Date</th></tr></thead>
        <tbody>
          ${items.map(s => `
            <tr>
              <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${s.original_filename}">${s.original_filename}</td>
              <td><span style="text-transform:capitalize; color:#94a3b8;">${s.file_type}</span></td>
              <td>${labelBadge(s.label)}</td>
              <td>${Math.round(s.confidence * 100)}%</td>
              <td style="color:#64748b; white-space:nowrap;">${new Date(s.created_at).toLocaleDateString()}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
    }

    loadDashboard();
  </script>
</body>
</html>
